services:
  postgres:
    image: postgres:15-alpine
    container_name: fopcam-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-fopcam}
      - POSTGRES_USER=${POSTGRES_USER:-fopcam}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-fopcam_secure_password_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fopcam-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-fopcam}']
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: fopcam-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    networks:
      - fopcam-network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fopcam-backend
    ports:
      - '8000:8000'
    restart: unless-stopped
    volumes:
      - ./backend/media:/app/media
      - ./backend/staticfiles:/app/staticfiles
    environment:
      - DJANGO_DEBUG=False
      - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS:-"*"}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - LIVEKIT_URL=${LIVEKIT_URL:-}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:-}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:-}
      - EMAIL_HOST=${EMAIL_HOST:-}
      - EMAIL_PORT=${EMAIL_PORT:-587}
      - EMAIL_USE_TLS=${EMAIL_USE_TLS:-True}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER:-}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD:-}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL:-}
      - WHATSAPP_PHONE_NUMBER_ID=${WHATSAPP_PHONE_NUMBER_ID:-}
      - WHATSAPP_ACCESS_TOKEN=${WHATSAPP_ACCESS_TOKEN:-}
      - WHATSAPP_TEMPLATE_NAME=${WHATSAPP_TEMPLATE_NAME:-fopcam_password_reset}
      - WHATSAPP_TEMPLATE_LANGUAGE=${WHATSAPP_TEMPLATE_LANGUAGE:-fr}
      - WHATSAPP_GRAPH_API_VERSION=${WHATSAPP_GRAPH_API_VERSION:-v22.0}
      - JWT_REFRESH_TOKEN_LIFETIME_DAYS=${JWT_REFRESH_TOKEN_LIFETIME_DAYS:-3650}
      - DATABASE_ENGINE=${DATABASE_ENGINE:-postgresql}
      - DATABASE_NAME=${POSTGRES_DB:-fopcam}
      - DATABASE_USER=${POSTGRES_USER:-fopcam}
      - DATABASE_PASSWORD=${POSTGRES_PASSWORD:-fopcam_secure_password_2026}
      - DATABASE_HOST=${DATABASE_HOST:-postgres}
      - DATABASE_PORT=${DATABASE_PORT:-5432}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-"your-secret-key-change-me"}
      - BASE_URL=${BASE_URL:-"http://localhost:8000"}
      - CORS_ALLOW_ALL_ORIGINS=${CORS_ALLOW_ALL_ORIGINS:-"False"}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-"http://localhost:3000,http://127.0.0.1:3000"}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-"http://localhost:3000,http://127.0.0.1:3000"}
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-"False"}
      - CSRF_COOKIE_SECURE=${CSRF_COOKIE_SECURE:-"False"}
    networks:
      - fopcam-network
    depends_on:
      - postgres
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-"http://localhost:8000"}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-"http://localhost:8000"}
    container_name: fopcam-frontend
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-"http://localhost:8000"}
      - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-"http://localhost:8000"}
    networks:
      - fopcam-network
    depends_on:
      - backend

networks:
  fopcam-network:
    driver: bridge

volumes:
  postgres_data:
